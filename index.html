<head>

<title>Directions to Joseph &amp; Helga's Residence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3559; --navy-deep:#182a47; --tar:#231f20; --dust:#c49a6c;
  --accent:#e53935; --ink:#ffffff; --muted:#b9c3cf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#1c3053; --navy-deep:#162541; } }
:root[data-theme="dark"]{ --navy:#1c3053; --navy-deep:#162541; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--dust);outline-offset:3px}

header{padding:18px 20px 12px}
h1{font-size:1.35rem;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}

.mapwrap{position:relative;flex:1 1 auto;min-height:280px;overflow:hidden;background:var(--navy-deep);
  border-top:4px solid var(--tar);border-bottom:4px solid var(--tar)}
.stage{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.stage img{display:block;width:100%;height:auto;user-select:none}
.pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);
  border:3px solid #fff;box-shadow:0 0 0 0 rgba(229,57,53,.7);animation:ping 1.6s infinite;transition:left .7s,top .7s;display:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(229,57,53,.7)}80%,100%{box-shadow:0 0 0 18px rgba(229,57,53,0)}}
@media (prefers-reduced-motion:reduce){.stage,.pin{transition:none}.pin{animation:none}}
.viewtoggle{position:absolute;right:12px;top:12px;background:var(--tar);border:0;border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700}

.panel{padding:18px 20px 22px;background:var(--navy)}
.choose p{margin:0 0 12px;font-weight:700;font-size:1.05rem}
.origin{display:block;width:100%;text-align:left;background:var(--tar);border:0;border-radius:14px;padding:16px 18px;margin-bottom:10px}
.origin strong{display:block;font-size:1.05rem}
.origin span{color:var(--muted);font-size:.9rem}

.nav{display:none}
.count{color:var(--dust);font-weight:700;font-size:.9rem;margin:0}
.instr{font-size:1.5rem;line-height:1.3;font-weight:700;margin:6px 0 18px;min-height:3.9em}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:16px 10px;font-weight:700;font-size:1rem;background:var(--tar)}
.btn.primary{background:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:.92rem}
.seg{display:flex;background:var(--tar);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--dust);color:var(--tar)}
.note{color:var(--muted);font-size:.85rem;margin:14px 0 0}
</style>
</head>

function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voiceObj = vs.find(v=>/en[-_](GB|ZA|KE|NG)/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text){
  if(!voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voiceObj) u.voice = voiceObj;
  u.rate = 0.92; u.lang = voiceObj ? voiceObj.lang : "en-GB";
  speechSynthesis.speak(u);
}

function place(){
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const ih = img.clientHeight || cw * 1433/1400;
  if(!route || !zoomed){
    const s = Math.min(1, ch/ih);
    const tx = (cw - cw*s)/2;
    stage.style.transform = `translate(${tx}px,0px) scale(${s})`;
    if(route){ const st = route[i]; pin.style.left = st.x+"%"; pin.style.top = st.y+"%"; }
    return;
  }
  const st = route[i], s = 2.4;
  const mx = st.x/100*cw, my = st.y/100*ih;
  let tx = cw/2 - mx*s, ty = ch/2 - my*s;
  tx = Math.min(0, Math.max(cw - cw*s, tx));
  ty = Math.min(0, Math.max(ch - ih*s, ty));
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  pin.style.left = st.x+"%"; pin.style.top = st.y+"%";
}

function show(){
  const st = route[i];
  $("count").textContent = st.end ? "Arrived" : `Step ${i+1} of ${route.length-1}`;
  $("instr").textContent = st.t;
  $("prev").disabled = i===0;
  $("next").disabled = !!st.end;
  $("next").textContent = i===route.length-2 ? "I'm here" : "Next turn";
  place();
  speak(st.t);
}

document.querySelectorAll(".origin").forEach(b=>b.addEventListener("click",()=>{
  route = ROUTES[b.dataset.route]; i=0; zoomed=true;
  $("choose").style.display="none"; $("nav").style.display="block";
  pin.style.display="block"; $("viewtoggle").hidden=false; $("viewtoggle").textContent="Whole map";
  show();
}));
$("next").onclick=()=>{ if(i<route.length-1){i++;show();} };
$("prev").onclick=()=>{ if(i>0){i--;show();} };
$("repeat").onclick=()=>speak(route[i].t);
$("restart").onclick=()=>{
  if('speechSynthesis' in window) speechSynthesis.cancel();
  route=null; $("nav").style.display="none"; $("choose").style.display="block";
  pin.style.display="none"; $("viewtoggle").hidden=true; place();
};
$("viewtoggle").onclick=()=>{ zoomed=!zoomed; $("viewtoggle").textContent = zoomed ? "Whole map" : "Zoom to step"; place(); };
$("v-on").onclick=()=>{ voice=true; $("v-on").setAttribute("aria-pressed","true"); $("v-off").setAttribute("aria-pressed","false"); if(route) speak(route[i].t); };
$("v-off").onclick=()=>{ voice=false; if('speechSynthesis' in window) speechSynthesis.cancel(); $("v-off").setAttribute("aria-pressed","true"); $("v-on").setAttribute("aria-pressed","false"); };

img.addEventListener("load", place);
window.addEventListener("resize", place);
place();
</script>
</body>
</html>
